# ===== logids 配置文件 =====
# 语法：key=value，# 或 ; 开头为注释
# 修改阈值后无需重编译，直接重新运行即可生效

# 滑动窗口长度（秒）：统计"单位时间内"的次数
window_seconds=300

# 暴力破解：窗口内同一 IP 失败登录达到该次数即告警
brute_force_threshold=5

# 路径扫描：窗口内同一 IP 产生 404 达到该次数即告警
notfound_threshold=20

# 端口扫描：窗口内同一 IP 访问的不同目的端口数达到该值即告警
distinct_port_threshold=10

# 同类告警合并窗口（秒）：窗口内同 IP 同类型告警只累计次数，避免刷屏
alert_dedup_seconds=60

# SSH 日志没有年份时，使用该年份补全
default_year=2026

# 日志格式：auto 自动识别 | web 只按访问日志解析 | ssh 只按认证/防火墙日志解析
log_format=auto

# CSV 报告输出路径
report_file=report.csv

# 是否彩色输出（1 开 / 0 关）
color=1
